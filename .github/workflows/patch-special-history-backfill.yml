name: Patch special history backfill
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/special-history-backfill
      - name: Patch backend
        shell: python
        run: |
          from pathlib import Path
          path = Path('web_nav_server.py')
          text = path.read_text(encoding='utf-8')

          old = '''PERSISTENT_STATE_FIELDS = (\n    DFS_MANUAL_FIELD,\n    SPECIAL_MANUAL_FIELD,\n    "dfs_original_page_description",'''
          new = '''SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD = "special_manual_history_migrated"\n\nPERSISTENT_STATE_FIELDS = (\n    DFS_MANUAL_FIELD,\n    SPECIAL_MANUAL_FIELD,\n    SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD,\n    "dfs_original_page_description",'''
          if old not in text:
              raise SystemExit('persistent fields anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''def maintain_special_dfs(payload: Dict[str, Any]) -> Dict[str, Any]:\n'''
          helper = '''def migrate_legacy_special_manual_history(state: Dict[str, Any]) -> bool:\n    """Backfill legacy recorded special steps into manual DFS exactly once."""\n    manual = state.get(SPECIAL_MANUAL_FIELD)\n    if not isinstance(manual, dict):\n        return False\n    if state.get(SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD):\n        return False\n\n    normalized_manual = normalize_special(manual)\n    recorded_state = dict(state)\n    recorded_state.pop(SPECIAL_MANUAL_FIELD, None)\n    recorded_state.pop(SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD, None)\n    recorded = build_special_operations(recorded_state)\n\n    changed = False\n    recorded_groups = list(recorded.values())\n    for operation_index, recorded_items in enumerate(recorded_groups, start=1):\n        operation_name = f"operation{operation_index}"\n        manual_items = normalized_manual.get(operation_name)\n        if manual_items is None:\n            normalized_manual[operation_name] = list(recorded_items)\n            changed = True\n            continue\n        if len(recorded_items) > len(manual_items):\n            manual_items.extend(recorded_items[len(manual_items):])\n            changed = True\n\n    if changed:\n        state[SPECIAL_MANUAL_FIELD] = normalize_special(normalized_manual)\n    state[SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD] = True\n    return True\n\n\n'''
          if anchor not in text:
              raise SystemExit('maintain_special_dfs anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''        special = normalize_special(payload.get("special") or {})\n        state[SPECIAL_MANUAL_FIELD] = special\n        message = "已保存 special DFS 人工维护数据。"'''
          new = '''        special = normalize_special(payload.get("special") or {})\n        state[SPECIAL_MANUAL_FIELD] = special\n        state[SPECIAL_MANUAL_HISTORY_MIGRATED_FIELD] = True\n        message = "已保存 special DFS 人工维护数据。"'''
          if old not in text:
              raise SystemExit('maintain save anchor not found')
          text = text.replace(old, new, 1)

          old = '''    graph = config.graphs.load()\n    state = graph.get("states", {}).get(page_name)\n    if not isinstance(state, dict):\n        raise ValueError(f"页面不存在：{page_name}")\n    transitions = graph.get("transitions", [])'''
          new = '''    graph = config.graphs.load()\n    state = graph.get("states", {}).get(page_name)\n    if not isinstance(state, dict):\n        raise ValueError(f"页面不存在：{page_name}")\n    if migrate_legacy_special_manual_history(state):\n        config.graphs.save(graph)\n    transitions = graph.get("transitions", [])'''
          if old not in text:
              raise SystemExit('page_detail anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Syntax check
        run: python -m py_compile web_nav_server.py DFS.py settings_ui_manual_recorder.py
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_nav_server.py
          git commit -m "Backfill legacy special recordings into DFS" || true
          git rm .github/workflows/patch-special-history-backfill.yml
          git commit -m "Remove temporary patch workflow"
          git push origin HEAD:fix/special-history-backfill
