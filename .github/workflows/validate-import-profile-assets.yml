name: Require latest capture assets
on:
  push:
    paths:
      - '.github/trigger-require-latest-assets'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-profile-assets
      - name: Patch validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('settings_ui_manual_recorder.py')
          text = p.read_text(encoding='utf-8')
          old = '''            source_graph_path = navigation_graph_path(source_dir)\n            if not source_graph_path.exists():\n                raise ValueError(\n                    "源采集目录缺少 outputs/navigation/settings_navigation_graph.json："\n                    f"{source_graph_path}"\n                )\n            graph = load_navigation_graph(source_dir)\n            source_filename = source_graph_path.name\n'''
          new = '''            source_graph_path = navigation_graph_path(source_dir)\n            if not source_graph_path.exists():\n                raise ValueError(\n                    "源采集目录缺少 outputs/navigation/settings_navigation_graph.json："\n                    f"{source_graph_path}"\n                )\n            required_latest = [\n                source_dir / "outputs" / "latest" / "current_screen.png",\n                source_dir / "outputs" / "latest" / "current_ui_tree.json",\n            ]\n            missing_latest = [str(path) for path in required_latest if not path.exists()]\n            if missing_latest:\n                raise ValueError(\n                    "源采集目录缺少完整 latest 采集文件，无法保证切换后截图/UI tree 可用："\n                    + "；".join(missing_latest)\n                )\n            graph = load_navigation_graph(source_dir)\n            source_filename = source_graph_path.name\n'''
          if old not in text:
              raise SystemExit('validation anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/validate-import-profile-assets.yml .github/trigger-require-latest-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add settings_ui_manual_recorder.py .github
          git commit -m 'Require latest capture assets for directory import'
          git push origin HEAD:fix/import-profile-assets
