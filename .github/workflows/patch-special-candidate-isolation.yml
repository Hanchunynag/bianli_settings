name: Patch special candidate isolation
on:
  push:
    paths:
      - '.github/trigger-special-candidate-isolation'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/special-owner-lock
      - name: Isolate special candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web_nav_server.py')
          text = p.read_text(encoding='utf-8')
          old = '''    upsert_clicked_target_as_candidate(graph, active_page, target, operation_id=operation_id)\n    if mode == "same_page":\n'''
          new = '''    if mode != "special":\n        upsert_clicked_target_as_candidate(graph, active_page, target, operation_id=operation_id)\n    if mode == "same_page":\n'''
          if old not in text:
              raise SystemExit('candidate isolation anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/patch-special-candidate-isolation.yml .github/trigger-special-candidate-isolation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_nav_server.py .github
          git commit -m 'Keep special steps out of normal page candidates'
          git push origin HEAD:fix/special-owner-lock
