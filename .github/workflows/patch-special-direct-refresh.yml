name: Patch direct special refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/special-direct-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/special-direct-refresh
          fetch-depth: 0
      - name: Apply direct special refresh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          nav = Path('static/nav.js')
          s = nav.read_text(encoding='utf-8')
          old = """  if (specialCapture) {\n    specialCapture.stepCount = nextSpecialStep;\n    renderFollowingActivePage(data);\n    return;\n  }\n"""
          new = """  if (specialCapture) {\n    specialCapture.stepCount = nextSpecialStep;\n    const recordedPageName = specialCapture.pageName || currentPageName();\n    renderFollowingActivePage(data);\n    window.dispatchEvent(new CustomEvent('special-operate-recorded', {\n      detail: { pageName: recordedPageName },\n    }));\n    return;\n  }\n"""
          if old not in s:
              raise SystemExit('nav.js target block not found')
          nav.write_text(s.replace(old, new, 1), encoding='utf-8')

          special = Path('static/nav/special-maintenance.js')
          s = special.read_text(encoding='utf-8')
          marker = """const pageDetail = document.getElementById('pageDetail');\n"""
          listener = """window.addEventListener('special-operate-recorded', async (event) => {\n  const pageName = String(\n    event.detail?.pageName\n    || currentDetailPage()\n    || '',\n  ).trim();\n  if (!pageName) return;\n  if (!await loadStructure(pageName)) return;\n\n  const section = document.querySelector('[data-special-array-maintenance]');\n  if (section) {\n    renderEditor(section);\n    return;\n  }\n  await mountEditor(true);\n});\n\n"""
          if marker not in s:
              raise SystemExit('special-maintenance marker not found')
          special.write_text(s.replace(marker, listener + marker, 1), encoding='utf-8')

          html = Path('templates/nav.html')
          s = html.read_text(encoding='utf-8')
          s = s.replace('nav.js?v=special-single-ui-19', 'nav.js?v=special-direct-refresh-20')
          s = s.replace('special-maintenance.js?v=special-ui-refresh-18', 'special-maintenance.js?v=special-direct-refresh-20')
          html.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/patch-special-direct-refresh.yml
          git config user.name "special-refresh-bot"
          git config user.email "special-refresh-bot@users.noreply.github.com"
          git add -A
          git commit -m "Refresh special DFS directly after recording"
          git push origin HEAD:fix/special-direct-refresh