name: Import key profile files

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/request-profiles-key-files

permissions:
  contents: write

jobs:
  import-key-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/request-profiles-key-files
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Expand selected source files
        shell: bash
        run: |
          set -euo pipefail
          cat .key-import/chunk_* > /tmp/key-files.b64
          base64 -d /tmp/key-files.b64 > /tmp/key-files.zip
          mkdir -p /tmp/key-files
          unzip -q /tmp/key-files.zip -d /tmp/key-files
          rsync -a /tmp/key-files/ ./
          rm -rf .key-import
          rm -f .github/workflows/import-key-files.yml

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          python -m unittest discover -v
          python -m py_compile DFS.py web_nav_server.py settings_profiles.py

      - name: Commit selected source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add request-scoped profiles and special DFS maintenance"
          git push origin HEAD:agent/request-profiles-key-files
