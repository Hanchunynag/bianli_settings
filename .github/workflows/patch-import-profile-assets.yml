name: Patch imported profile assets
on:
  push:
    paths:
      - '.github/trigger-import-profile-assets'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-profile-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch production files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          recorder = Path('settings_ui_manual_recorder.py')
          text = recorder.read_text(encoding='utf-8')

          text = text.replace(
          '''    def import_graph(\n        self,\n        *,\n        name: str,\n        settings_version: str,\n        device_model: str,\n        graph: Dict[str, Any],\n        source_filename: str = "",\n    ) -> Dict[str, Any]:\n        """Register an already-recorded navigation graph as an independent profile."""\n        name = str(name or "").strip()\n        settings_version = str(settings_version or "").strip()\n        device_model = str(device_model or "").strip()\n        source_filename = Path(str(source_filename or "")).name\n        if not settings_version:\n            raise ValueError("设置版本不能为空")\n        if not device_model:\n            raise ValueError("机型不能为空")\n        if not isinstance(graph, dict):\n            raise ValueError("导入 Graph 必须是 JSON 对象")\n\n        imported_graph = json.loads(json.dumps(graph, ensure_ascii=False))\n''',
          '''    def import_graph(\n        self,\n        *,\n        name: str,\n        settings_version: str,\n        device_model: str,\n        graph: Optional[Dict[str, Any]] = None,\n        source_filename: str = "",\n        source_work_dir: str = "",\n    ) -> Dict[str, Any]:\n        """Import one recorded work_dir as an independent profile, including capture assets."""\n        name = str(name or "").strip()\n        settings_version = str(settings_version or "").strip()\n        device_model = str(device_model or "").strip()\n        source_filename = Path(str(source_filename or "")).name\n        source_dir: Optional[Path] = None\n        source_work_dir = str(source_work_dir or "").strip()\n        if source_work_dir:\n            source_dir = Path(source_work_dir).expanduser()\n            if not source_dir.is_absolute():\n                source_dir = (self.base_work_dir.resolve().parent / source_dir).resolve()\n            else:\n                source_dir = source_dir.resolve()\n            if not source_dir.exists() or not source_dir.is_dir():\n                raise ValueError(f"源采集目录不存在：{source_dir}")\n            source_graph_path = navigation_graph_path(source_dir)\n            if not source_graph_path.exists():\n                raise ValueError(\n                    "源采集目录缺少 outputs/navigation/settings_navigation_graph.json："\n                    f"{source_graph_path}"\n                )\n            graph = load_navigation_graph(source_dir)\n            source_filename = source_graph_path.name\n        if not settings_version:\n            raise ValueError("设置版本不能为空")\n        if not device_model:\n            raise ValueError("机型不能为空")\n        if not isinstance(graph, dict):\n            raise ValueError("导入 Graph 必须是 JSON 对象；推荐填写源采集目录进行完整导入")\n\n        imported_graph = json.loads(json.dumps(graph, ensure_ascii=False))\n''')

          old_dup = '''        if duplicate:\n            raise ValueError(\n                f"该设置版本和机型已经存在：{duplicate.get('name') or duplicate['profile_id']}"\n            )\n\n        profile_id = f"profile_{uuid.uuid4().hex[:12]}"\n        created_at = now_iso()\n        profile = {\n            "profile_id": profile_id,\n            "name": name or f"{settings_version} · {device_model}",\n            "settings_version": settings_version,\n            "device_model": device_model,\n            "parent_profile_id": "",\n            "source": "imported_graph",\n            "source_filename": source_filename,\n            "created_at": created_at,\n            "updated_at": created_at,\n            "is_default": False,\n        }\n'''
          new_dup = '''        reuse_imported_profile = bool(\n            duplicate\n            and source_dir is not None\n            and str(duplicate.get("source") or "") in {"imported_graph", "imported_work_dir"}\n        )\n        if duplicate and not reuse_imported_profile:\n            raise ValueError(\n                f"该设置版本和机型已经存在：{duplicate.get('name') or duplicate['profile_id']}"\n            )\n\n        profile_id = (\n            str(duplicate["profile_id"])\n            if reuse_imported_profile\n            else f"profile_{uuid.uuid4().hex[:12]}"\n        )\n        created_at = str(duplicate.get("created_at") or now_iso()) if reuse_imported_profile else now_iso()\n        profile = {\n            "profile_id": profile_id,\n            "name": name or f"{settings_version} · {device_model}",\n            "settings_version": settings_version,\n            "device_model": device_model,\n            "parent_profile_id": "",\n            "source": "imported_work_dir" if source_dir is not None else "imported_graph",\n            "source_filename": source_filename,\n            "source_work_dir": str(source_dir) if source_dir is not None else "",\n            "created_at": created_at,\n            "updated_at": now_iso(),\n            "is_default": False,\n        }\n'''
          if old_dup not in text:
              raise SystemExit('duplicate/profile block not found')
          text = text.replace(old_dup, new_dup, 1)

          text = text.replace(
          '''                "source",\n                "source_filename",\n            )\n        }\n        target_work_dir = self.profile_work_dir(profile_id)\n        save_navigation_graph(imported_graph, target_work_dir)\n        save_current_path_session(target_work_dir, root_page)\n        profiles.append(profile)\n        self._save_profiles(profiles)\n        return profile\n''',
          '''                "source",\n                "source_filename",\n                "source_work_dir",\n            )\n        }\n        target_work_dir = self.profile_work_dir(profile_id)\n\n        if source_dir is not None:\n            source_outputs = source_dir / "outputs"\n            target_outputs = target_work_dir / "outputs"\n            if source_outputs.exists():\n                target_outputs.mkdir(parents=True, exist_ok=True)\n\n                def copy_entry(source: Path, target: Path) -> None:\n                    if source.is_dir():\n                        shutil.copytree(source, target, dirs_exist_ok=True)\n                    else:\n                        target.parent.mkdir(parents=True, exist_ok=True)\n                        shutil.copy2(source, target)\n\n                for source_entry in source_outputs.iterdir():\n                    if source_entry.name != "navigation":\n                        copy_entry(source_entry, target_outputs / source_entry.name)\n                        continue\n                    target_navigation = target_outputs / "navigation"\n                    target_navigation.mkdir(parents=True, exist_ok=True)\n                    skip_navigation = {\n                        SETTINGS_PROFILE_REGISTRY,\n                        "settings_navigation_graph.json",\n                        "settings_navigation_paths.json",\n                        "current_path_session.json",\n                        "pending_transition.json",\n                        "pending_action_chain.json",\n                    }\n                    for navigation_entry in source_entry.iterdir():\n                        if navigation_entry.name in skip_navigation:\n                            continue\n                        copy_entry(\n                            navigation_entry,\n                            target_navigation / navigation_entry.name,\n                        )\n\n            capture_dir = (\n                target_work_dir / "outputs" / "navigation" / "continued_captures"\n            )\n            for state in imported_graph.get("states", {}).values():\n                if not isinstance(state, dict):\n                    continue\n                for capture in state.get("continued_captures", []) or []:\n                    if not isinstance(capture, dict) or not capture.get("screenshot"):\n                        continue\n                    copied = capture_dir / Path(str(capture["screenshot"])).name\n                    if copied.exists():\n                        capture["screenshot"] = str(copied)\n\n        save_navigation_graph(imported_graph, target_work_dir)\n        save_current_path_session(target_work_dir, root_page)\n        if reuse_imported_profile and duplicate is not None:\n            duplicate.update(profile)\n        else:\n            profiles.append(profile)\n        self._save_profiles(profiles)\n        return profile\n''', 1)

          text = text.replace(
          '''class ImportSettingsProfileRequest(BaseModel):\n    name: str = ""\n    settings_version: str\n    device_model: str\n    source_filename: str = ""\n    graph: Dict[str, Any]\n''',
          '''class ImportSettingsProfileRequest(BaseModel):\n    name: str = ""\n    settings_version: str\n    device_model: str\n    source_work_dir: str = ""\n    source_filename: str = ""\n    graph: Optional[Dict[str, Any]] = None\n''')
          recorder.write_text(text, encoding='utf-8')

          server = Path('web_nav_server.py')
          text = server.read_text(encoding='utf-8')
          text = text.replace(
              '"screenshot_url": f"/screen?t={int(time.time() * 1000)}",',
              '"screenshot_url": f"/screen?profile_id={config.profile_id}&t={int(time.time() * 1000)}",',
          )
          text = text.replace(
          '''        source_filename=req.source_filename,\n        graph=req.graph,\n    )\n''',
          '''        source_filename=req.source_filename,\n        source_work_dir=req.source_work_dir,\n        graph=req.graph,\n    )\n''', 1)
          text = text.replace(
          '''        output_path=compact.get("output_path", ""),\n        message=(\n            f"已导入 Graph 并创建配置“{profile.get('name')}”："\n            f"{len(imported_graph.get('states', {}) or {})} 页面，"\n            f"{len(imported_graph.get('transitions', []) or [])} 跳转。"\n        ),\n''',
          '''        output_path=compact.get("output_path", ""),\n        copied_latest=(\n            (profile_work_dir / "outputs" / "latest" / "current_screen.png").exists()\n            and (profile_work_dir / "outputs" / "latest" / "current_ui_tree.json").exists()\n        ),\n        message=(\n            f"已导入采集目录并创建/更新配置“{profile.get('name')}”："\n            f"{len(imported_graph.get('states', {}) or {})} 页面，"\n            f"{len(imported_graph.get('transitions', []) or [])} 跳转；"\n            "Graph、latest 采集文件和历史截图均维护在该 profile 本地目录。"\n        ),\n''', 1)
          server.write_text(text, encoding='utf-8')

          nav = Path('static/nav.js')
          text = nav.read_text(encoding='utf-8')
          text = text.replace(
              "active?.source === 'imported_graph'",
              "['imported_graph', 'imported_work_dir'].includes(active?.source)",
          )
          text = text.replace(
              "`导入 Graph：${active.source_filename || '本地 JSON'}`",
              "active.source === 'imported_work_dir' ? `导入采集目录：${active.source_work_dir || active.source_filename || '-'}` : `导入 Graph：${active.source_filename || '本地 JSON'}`",
          )
          text = text.replace(
              "profile.source === 'imported_graph'",
              "['imported_graph', 'imported_work_dir'].includes(profile.source)",
          )
          text = text.replace(
              "? `导入已有 Graph${profile.source_filename ? `：${escapeHtml(profile.source_filename)}` : ''}`",
              "? (profile.source === 'imported_work_dir' ? `导入采集目录：${escapeHtml(profile.source_work_dir || profile.source_filename || '-')}` : `导入已有 Graph${profile.source_filename ? `：${escapeHtml(profile.source_filename)}` : ''}`)",
          )
          pattern = re.compile(r"el\('settingsProfileImportForm'\)\.onsubmit = async \(event\) => \{.*?\n\};\n\nel\('screen'\)\.addEventListener", re.S)
          replacement = '''el('settingsProfileImportForm').onsubmit = async (event) => {\n  event.preventDefault();\n  const form = event.currentTarget;\n  const sourceWorkDir = String(form.elements.source_work_dir.value || '').trim();\n  if (!sourceWorkDir) {\n    window.alert('请填写项目本地的源采集目录。');\n    return;\n  }\n  const result = await postJson('/api/settings_profiles/import', {\n    name: form.elements.name.value,\n    settings_version: form.elements.settings_version.value,\n    device_model: form.elements.device_model.value,\n    source_work_dir: sourceWorkDir,\n  });\n  if (!result) return;\n  store.activeSettingsProfileId = result.profile.profile_id;\n  try {\n    window.sessionStorage.setItem(\n      'settingsProfileId',\n      result.profile.profile_id,\n    );\n  } catch (_error) {\n    // 浏览器禁用 sessionStorage 时仍使用当前标签页内存状态。\n  }\n  resetDirectoryForProfileSwitch();\n  form.reset();\n  await refreshSettingsProfiles();\n  el('settingsProfileDialog').close();\n  renderFollowingActivePage(await api('/api/state'));\n  el('overlayStatus').textContent = result.message;\n  el('overlayStatus').classList.remove('hidden');\n};\n\nel('screen').addEventListener'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('import form handler not found')
          nav.write_text(text, encoding='utf-8')

          html = Path('templates/nav.html')
          text = html.read_text(encoding='utf-8')
          pattern = re.compile(r'''    <form id="settingsProfileImportForm" class="settingsProfileForm">.*?    </form>''', re.S)
          replacement = '''    <form id="settingsProfileImportForm" class="settingsProfileForm">\n      <h3>导入已有采集目录</h3>\n      <p class="muted">填写项目本地之前采集好的 work_dir。目录内必须包含 outputs/navigation/settings_navigation_graph.json；outputs/latest、历史截图和其他采集文件会一起复制到新的 profile 目录。</p>\n      <label>\n        <span>源采集目录</span>\n        <input name="source_work_dir" placeholder="例如：demo_settings_matex5_5_0" required />\n      </label>\n      <label>\n        <span>配置名称（可选）</span>\n        <input name="name" placeholder="例如：历史 Mate X5 采集" />\n      </label>\n      <div class="profileFormGrid">\n        <label>\n          <span>设置版本</span>\n          <input name="settings_version" placeholder="例如：HarmonyOS 5.0" required />\n        </label>\n        <label>\n          <span>机型</span>\n          <input name="device_model" placeholder="例如：Mate X5" required />\n        </label>\n      </div>\n      <div class="profileFormActions">\n        <button class="primary" type="submit">导入目录并切换</button>\n      </div>\n    </form>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('import form html not found')
          text = text.replace('nav.js?v=graph-import-24', 'nav.js?v=graph-import-assets-25')
          html.write_text(text, encoding='utf-8')
          PY
      - name: Commit production changes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-import-profile-assets.yml .github/trigger-import-profile-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add settings_ui_manual_recorder.py web_nav_server.py static/nav.js templates/nav.html .github
          git commit -m 'Import profile capture assets and scope screenshots'
          git push origin HEAD:fix/import-profile-assets
