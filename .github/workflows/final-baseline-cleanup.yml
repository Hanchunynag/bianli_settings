name: Final baseline cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/baseline-only-profile-special'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/baseline-only-profile-special
          fetch-depth: 0
      - name: Remove test and helper clutter
        shell: bash
        run: |
          set -euo pipefail
          rm -f test_*.py
          rm -f dfs_core.py settings_profiles.py special_opearte_contract.py
          if [ -f static/nav/special-array-maintenance.js ]; then
            cp static/nav/special-array-maintenance.js static/nav/special-maintenance.js
          fi
          rm -f static/nav/special-array-maintenance.js
          rm -rf .cleanup-import
          rm -f .github/workflows/final-baseline-cleanup.yml
          python -m py_compile DFS.py settings_ui_manual_recorder.py web_nav_server.py
          git config user.name "cleanup-baseline-bot"
          git config user.email "cleanup-baseline-bot@users.noreply.github.com"
          git add -A
          git commit -m "Keep baseline production files only"
          git push origin HEAD:cleanup/baseline-only-profile-special
