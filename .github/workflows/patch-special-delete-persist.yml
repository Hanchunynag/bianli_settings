name: Patch special delete persistence
on:
  push:
    branches:
      - fix/special-delete-persist
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/special-delete-persist
      - name: Patch existing production files
        shell: python
        run: |
          from pathlib import Path

          path = Path('static/nav/special-maintenance.js')
          text = path.read_text(encoding='utf-8')

          old = '''    } else if (action === 'operation-delete') {\n      if (!window.confirm(`确认删除 operation${operationIndex + 1}？`)) return;\n      operations.splice(operationIndex, 1);\n    } else if (action === 'item-add') {'''
          new = '''    } else if (action === 'operation-delete') {\n      if (!window.confirm(`确认删除 operation${operationIndex + 1}？删除后会立即保存。`)) return;\n      operations.splice(operationIndex, 1);\n      await saveStructure(pageName);\n      renderEditor(section);\n      return;\n    } else if (action === 'item-add') {'''
          if old not in text:
              raise SystemExit('operation-delete anchor not found')
          text = text.replace(old, new, 1)

          old = '''    } else if (action === 'item-delete') {\n      const items = operations[operationIndex];\n      if (!items) return;\n      if (items.length === 1) {\n        if (!window.confirm('这是该 operation 的最后一个数组项，删除后整个 operation 也会删除。继续？')) return;\n        operations.splice(operationIndex, 1);\n      } else {\n        items.splice(itemIndex, 1);\n      }\n    } else if (action === 'reload') {'''
          new = '''    } else if (action === 'item-delete') {\n      const items = operations[operationIndex];\n      if (!items) return;\n      if (items.length === 1) {\n        if (!window.confirm('这是该 operation 的最后一个数组项，删除后整个 operation 也会立即保存。继续？')) return;\n        operations.splice(operationIndex, 1);\n      } else {\n        if (!window.confirm(`确认删除 operation${operationIndex + 1} 的数组第 ${itemIndex + 1} 项？删除后会立即保存。`)) return;\n        items.splice(itemIndex, 1);\n      }\n      await saveStructure(pageName);\n      renderEditor(section);\n      return;\n    } else if (action === 'reload') {'''
          if old not in text:
              raise SystemExit('item-delete anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('templates/nav.html')
          text = path.read_text(encoding='utf-8')
          old = '../static/nav/special-maintenance.js?v=special-direct-refresh-20'
          new = '../static/nav/special-maintenance.js?v=special-delete-persist-23'
          if old not in text:
              raise SystemExit('special maintenance cache anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/nav/special-maintenance.js templates/nav.html
          git commit -m "Persist special operation deletions immediately" || true
          git rm .github/workflows/patch-special-delete-persist.yml
          git commit -m "Remove temporary patch workflow"
          git push origin HEAD:fix/special-delete-persist
