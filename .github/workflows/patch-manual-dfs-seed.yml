name: Patch manual DFS maintenance seed
on:
  push:
    branches:
      - fix/manual-dfs-seed
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-dfs-seed
      - name: Patch existing production files
        shell: python
        run: |
          from pathlib import Path

          # 1) DFS.py: a manual page DFS becomes a traversal anchor for descendants.
          path = Path('DFS.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for page_name, state in states.items():\n        if page_name in visited or not isinstance(state, dict):\n            continue\n        manual = normalize_manual_dfs(state.get(DFS_MANUAL_FIELD))\n        if not manual or not manual.get("path_snapshot"):\n            continue\n        records.append({\n            "page_name": str(page_name),\n            **manual,\n            "special_opearte": build_special_operations(state),\n            "is_manual": True,\n        })\n        visited.add(str(page_name))\n\n    return records, sorted(str(page) for page in states if page not in visited)\n'''
          new = '''    # A manually maintained page is a valid DFS anchor.  Continue walking its\n    # descendants from the manual path instead of forcing every child below an\n    # unlocatable transition to be maintained by hand as well.\n    for page_name, state in states.items():\n        if page_name in visited or not isinstance(state, dict):\n            continue\n        manual = normalize_manual_dfs(state.get(DFS_MANUAL_FIELD))\n        if not manual or not manual.get("path_snapshot"):\n            continue\n        manual_description = str(\n            manual.get("page_description") or page_name\n        ).strip()\n        visit(\n            str(page_name),\n            [dict(target) for target in manual["path_snapshot"]],\n            [manual_description] if manual_description else [],\n        )\n\n    return records, sorted(str(page) for page in states if page not in visited)\n'''
          if old not in text:
              raise SystemExit('DFS manual anchor block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) web_nav_server.py: when auto DFS is incomplete, seed the editor
          # with the unique parent's valid path.  This is an editable draft, not
          # a generated DFS record and contains no coordinate fallback.
          path = Path('web_nav_server.py')
          text = path.read_text(encoding='utf-8')
          old = '''    generated_dfs_record = dfs_record_for_page(graph, page_name)\n    root_page = str(graph.get("traversal_config", {}).get("root_page") or "Pages_root")\n    dfs_issue = ""\n    if generated_dfs_record is None and page_name != root_page:\n        incoming = [\n            item for item in transitions\n            if isinstance(item, dict) and item.get("to_page") == page_name\n        ]\n        direct_invalid = [\n            item for item in incoming\n            if transition_dfs_targets(item) is None\n        ]\n        if direct_invalid:\n            dfs_issue = (\n                "当前页面已绑定父级，但进入该页面的跳转缺少可执行 key/text locator；"\n                "自动 DFS 不会继承父页面路径，请人工维护缺失的最后一步。"\n            )\n        elif incoming:\n            dfs_issue = (\n                "当前页面存在进入跳转，但上游路径中有缺失的 key/text locator；"\n                "自动 DFS 暂不可达。"\n            )\n        else:\n            dfs_issue = "当前页面没有从根页面可达的完整跳转路径，自动 DFS 暂不可用。"\n    dfs_record = generated_dfs_record or {\n        "package_name": str(graph.get("package_name") or ""),\n        "main_page_name": str(graph.get("main_page_name") or ""),\n        "page_description": str(\n            state.get("last_title") or state.get("page_description") or page_name\n        ),\n        "path_snapshot": [],\n    }\n'''
          new = '''    generated_dfs_record = dfs_record_for_page(graph, page_name)\n    root_page = str(graph.get("traversal_config", {}).get("root_page") or "Pages_root")\n    dfs_issue = ""\n    dfs_seed_from_parent = False\n    dfs_seed_parent = ""\n    dfs_seed_path: List[Dict[str, Any]] = []\n    if generated_dfs_record is None and page_name != root_page:\n        incoming = [\n            item for item in transitions\n            if isinstance(item, dict) and item.get("to_page") == page_name\n        ]\n        incoming_parents = list(dict.fromkeys(\n            str(item.get("from_page") or "")\n            for item in incoming\n            if str(item.get("from_page") or "")\n        ))\n        if len(incoming_parents) == 1:\n            dfs_seed_parent = incoming_parents[0]\n            parent_record = dfs_record_for_page(graph, dfs_seed_parent)\n            if isinstance(parent_record, dict):\n                dfs_seed_path = [\n                    dict(item)\n                    for item in parent_record.get("path_snapshot") or []\n                    if isinstance(item, dict)\n                ]\n                dfs_seed_from_parent = True\n\n        direct_invalid = [\n            item for item in incoming\n            if transition_dfs_targets(item) is None\n        ]\n        if direct_invalid and dfs_seed_from_parent:\n            dfs_issue = (\n                "当前页面已绑定父级，但最后一跳缺少可执行 key/text locator；"\n                "已带出父页面 DFS 前缀，请人工新增当前页最后一步并保存。"\n            )\n        elif direct_invalid:\n            dfs_issue = (\n                "当前页面已绑定父级，但进入该页面的跳转缺少可执行 key/text locator；"\n                "请人工维护完整 DFS。"\n            )\n        elif incoming:\n            dfs_issue = (\n                "当前页面存在进入跳转，但上游路径中有缺失的 key/text locator；"\n                "请从最近的有效路径开始人工维护。"\n            )\n        else:\n            dfs_issue = "当前页面没有从根页面可达的完整跳转路径，请人工维护 DFS。"\n    dfs_record = generated_dfs_record or {\n        "package_name": str(graph.get("package_name") or ""),\n        "main_page_name": str(graph.get("main_page_name") or ""),\n        "page_description": str(\n            state.get("last_title") or state.get("page_description") or page_name\n        ),\n        "path_snapshot": dfs_seed_path,\n    }\n'''
          if old not in text:
              raise SystemExit('page detail DFS block not found')
          text = text.replace(old, new, 1)
          old = '''        dfs_manual=state.get(DFS_MANUAL_FIELD),\n        dfs_issue=dfs_issue,\n    )\n'''
          new = '''        dfs_manual=state.get(DFS_MANUAL_FIELD),\n        dfs_issue=dfs_issue,\n        dfs_seed_from_parent=dfs_seed_from_parent,\n        dfs_seed_parent=dfs_seed_parent,\n    )\n'''
          if old not in text:
              raise SystemExit('page detail response anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3) render.js: expose explicit manual key/text step insertion.
          path = Path('static/nav/render.js')
          text = path.read_text(encoding='utf-8')
          old = '''  const dfsIsManual = Boolean(data.dfs_manual);\n  const dfsIssue = String(data.dfs_issue || '').trim();\n  const dfsStatusLabel = dfsIsManual ? '人工配置' : (dfsIssue ? '待维护' : '自动生成');\n'''
          new = '''  const dfsIsManual = Boolean(data.dfs_manual);\n  const dfsIssue = String(data.dfs_issue || '').trim();\n  const dfsSeedFromParent = Boolean(data.dfs_seed_from_parent);\n  const dfsStatusLabel = dfsIsManual ? '人工配置' : (dfsIssue ? '待维护' : '自动生成');\n'''
          if old not in text:
              raise SystemExit('render DFS status anchor not found')
          text = text.replace(old, new, 1)
          old = '''        ${dfsIssue ? `<p class="muted"><strong>自动 DFS 未完成：</strong>${escapeHtml(dfsIssue)}</p>` : ''}\n        <section class="dfsEditor">\n'''
          new = '''        ${dfsIssue ? `<p class="muted"><strong>自动 DFS 未完成：</strong>${escapeHtml(dfsIssue)}</p>` : ''}\n        ${dfsIssue && dfsSeedFromParent ? '<p class="muted">下方 path_snapshot 已预填父页面有效路径；只需补当前页面最后一步，不会写入坐标定位。</p>' : ''}\n        <section class="dfsEditor">\n'''
          if old not in text:
              raise SystemExit('render issue hint anchor not found')
          text = text.replace(old, new, 1)
          old = '''            <div class="dfsEditorActions">\n              <button class="primary" type="submit">保存 DFS 数据</button>\n              <button class="secondary" type="button" data-action="view-dfs">查看 DFS 分支</button>\n'''
          new = '''            <div class="dfsEditorActions">\n              <button class="primary" type="submit">保存 DFS 数据</button>\n              ${dfsIssue ? '<button class="secondary" type="button" data-action="add-dfs-key-step">+ 新增 key 步骤</button><button class="secondary" type="button" data-action="add-dfs-text-step">+ 新增 text 步骤</button>' : ''}\n              <button class="secondary" type="button" data-action="view-dfs">查看 DFS 分支</button>\n'''
          if old not in text:
              raise SystemExit('render DFS actions anchor not found')
          text = text.replace(old, new, 1)
          old = '''    const action = button.dataset.action;\n    if (action === 'rename') {\n      renamePage(data);\n'''
          new = '''    const action = button.dataset.action;\n    if (action === 'add-dfs-key-step' || action === 'add-dfs-text-step') {\n      const textarea = dfsForm.elements.path_snapshot;\n      let pathSnapshot;\n      try {\n        pathSnapshot = JSON.parse(textarea.value || '[]');\n        if (!Array.isArray(pathSnapshot)) throw new Error('必须是 JSON 数组');\n      } catch (error) {\n        el('error').textContent = `path_snapshot 格式错误：${error.message}`;\n        el('error').classList.remove('hidden');\n        return;\n      }\n      const locatorType = action === 'add-dfs-key-step' ? 'key' : 'text';\n      pathSnapshot.push({\n        type: locatorType,\n        value: '',\n        key_description: '',\n        step_prompt: '',\n      });\n      textarea.value = JSON.stringify(pathSnapshot, null, 2);\n      textarea.focus();\n      textarea.setSelectionRange(textarea.value.length, textarea.value.length);\n      el('error').classList.add('hidden');\n    } else if (action === 'rename') {\n      renamePage(data);\n'''
          if old not in text:
              raise SystemExit('render click handler anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) cache bust only.
          path = Path('static/nav.js')
          text = path.read_text(encoding='utf-8')
          old = "./nav/render.js?v=dfs-invalid-transition-21"
          new = "./nav/render.js?v=manual-dfs-seed-22"
          if old not in text:
              raise SystemExit('nav.js render cache anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('templates/nav.html')
          text = path.read_text(encoding='utf-8')
          old = '../static/nav.js?v=dfs-invalid-transition-21'
          new = '../static/nav.js?v=manual-dfs-seed-22'
          if old not in text:
              raise SystemExit('nav.html cache anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DFS.py web_nav_server.py static/nav/render.js static/nav.js templates/nav.html
          git commit -m "Enable manual DFS repair from parent path" || true
          git rm .github/workflows/patch-manual-dfs-seed.yml
          git commit -m "Remove temporary patch workflow"
          git push origin HEAD:fix/manual-dfs-seed
