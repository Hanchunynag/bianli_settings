name: Import uploaded merged project

on:
  push:
    branches:
      - merge/request-scoped-profiles

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand uploaded project and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .project-import/chunk_* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/project/ ./
          rm -rf .project-import
          rm -f .github/workflows/import-project.yml
          python -m unittest discover -v
          python -m py_compile DFS.py settings_ui_manual_recorder.py settings_profiles.py web_nav_server.py
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Merge request-scoped profiles with special operation fixes"
          git push origin HEAD:merge/request-scoped-profiles
