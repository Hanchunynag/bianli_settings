name: Patch copy special operation
on:
  push:
    paths:
      - '.github/trigger-copy-special-operation'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/copy-special-operation
      - name: Patch production files
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('static/nav/special-maintenance.js')
          text = p.read_text(encoding='utf-8')
          old = '''          <button class="secondary compact" type="button" data-special-array-action="operation-down" data-operation-index="${operationIndex}" ${operationIndex === operations.length - 1 ? 'disabled' : ''}>operation 下移</button>\n          <button class="danger compact" type="button" data-special-array-action="operation-delete" data-operation-index="${operationIndex}">删除 operation</button>'''
          new = '''          <button class="secondary compact" type="button" data-special-array-action="operation-down" data-operation-index="${operationIndex}" ${operationIndex === operations.length - 1 ? 'disabled' : ''}>operation 下移</button>\n          <button class="secondary compact" type="button" data-special-array-action="operation-copy" data-operation-index="${operationIndex}">复制 operation</button>\n          <button class="danger compact" type="button" data-special-array-action="operation-delete" data-operation-index="${operationIndex}">删除 operation</button>'''
          if old not in text:
              raise SystemExit('operation actions anchor not found')
          text = text.replace(old, new, 1)

          old = '''    } else if (action === 'operation-down') {\n      moveItem(operations, operationIndex, 1);\n    } else if (action === 'operation-delete') {'''
          new = '''    } else if (action === 'operation-down') {\n      moveItem(operations, operationIndex, 1);\n    } else if (action === 'operation-copy') {\n      const sourceItems = operations[operationIndex];\n      if (!Array.isArray(sourceItems) || !sourceItems.length) return;\n      operations.push(sourceItems.map(cloneItem));\n      await saveStructure(pageName);\n      renderEditor(section);\n      return;\n    } else if (action === 'operation-delete') {'''
          if old not in text:
              raise SystemExit('operation handler anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('templates/nav.html')
          text = p.read_text(encoding='utf-8')
          old = '<script type="module" src="../static/nav/special-maintenance.js?v=special-delete-persist-23"></script>'
          new = '<script type="module" src="../static/nav/special-maintenance.js?v=special-operation-copy-24"></script>'
          if old not in text:
              raise SystemExit('special maintenance cache-bust anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/patch-copy-special-operation.yml .github/trigger-copy-special-operation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/nav/special-maintenance.js templates/nav.html .github
          git commit -m 'Add copy action for special operations'
          git push origin HEAD:feature/copy-special-operation
